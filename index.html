<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>field</title>
  <style>
    :root { --sz: 422px; }
    @media (min-width: 1440px) { :root { --sz: 576px; } }
    @media (max-width: 480px)  { :root { --sz: 322px; } }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      grid-template-rows: repeat(16, 1fr);
      width: var(--sz);
      height: var(--sz);
      padding: 20px;
      gap: 1px;
      background: #000;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      touch-action: none;
      position: relative;
      overflow: hidden;
    }

    #grid::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle 120px at var(--mx, 50%) var(--my, 50%),
        rgba(255,255,255,0.035) 0%,
        transparent 100%
      );
      opacity: var(--glow, 0);
      transition: opacity 0.4s;
      border-radius: inherit;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .filing {
      width: 70%;
      height: 2px;
      background: #fff;
      border-radius: 1px;
      transform-origin: 50% 50%;
      will-change: transform;
      opacity: 0.82;
    }

    #label {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="grid"></div>
    <span id="label">field — move + click</span>
  </div>

  <script>
    const SIZE = 16;
    const LERP = 0.16;

    const grid = document.getElementById('grid');

    const filings = [];
    for (let i = 0; i < SIZE * SIZE; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const f = document.createElement('div');
      f.className = 'filing';
      cell.appendChild(f);
      grid.appendChild(cell);
      filings.push(f);
    }

    const centers   = filings.map(() => ({ x: 0, y: 0 }));
    const curAngles = new Float32Array(SIZE * SIZE);
    const tgtAngles = new Float32Array(SIZE * SIZE);
    const burstVel  = new Float32Array(SIZE * SIZE);

    let mx = -9999, my = -9999;
    let isInside = false;

    function updateCenters() {
      filings.forEach((f, i) => {
        const r = f.getBoundingClientRect();
        centers[i].x = r.left + r.width  / 2;
        centers[i].y = r.top  + r.height / 2;
      });
    }

    updateCenters();
    window.addEventListener('resize', updateCenters);

    // ── Audio ─────────────────────────────────────────────────
    let AC;
    function ac() {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state === 'suspended') AC.resume();
      return AC;
    }

    // Game Boy pentatonic across 3 octaves
    const GB_NOTES = [131,165,196,220,262,294,330,392,440,523,587,659,784,880,1047];

    function synthTick(freq = 1200, dur = 0.045, vol = 0.055) {
      try {
        const a = ac(), t = a.currentTime;
        const r = grid.getBoundingClientRect();
        const xFrac = Math.max(0, Math.min(1, (mx - r.left) / r.width));
        const note = GB_NOTES[Math.min(Math.floor(xFrac * GB_NOTES.length), GB_NOTES.length - 1)];
        const o = a.createOscillator(), g = a.createGain();
        o.connect(g); g.connect(a.destination);
        o.type = 'square'; o.frequency.value = note;
        g.gain.setValueAtTime(0.038, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.052);
        o.start(t); o.stop(t + 0.056);
      } catch (_) {}
    }

    function synthClick() {
      try {
        const a = ac(), t = a.currentTime;
        // Game Boy power-up — ascending C major arpeggio, square wave
        [262, 330, 392, 523, 659, 784, 1047].forEach((note, i) => {
          const d = i * 0.048;
          const o = a.createOscillator(), g = a.createGain();
          o.connect(g); g.connect(a.destination);
          o.type = 'square'; o.frequency.value = note;
          g.gain.setValueAtTime(0.048, t + d);
          g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.075);
          o.start(t + d); o.stop(t + d + 0.08);
        });
      } catch (_) {}
    }

    let lastTickX = 0, lastTickY = 0;
    function maybeTick(x, y) {
      if (!isInside) return;
      const dx = x - lastTickX, dy = y - lastTickY;
      if (dx * dx + dy * dy >= 28 * 28) {
        synthTick();
        lastTickX = x; lastTickY = y;
      }
    }

    window.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      maybeTick(mx, my);
      if (isInside) {
        const r = grid.getBoundingClientRect();
        grid.style.setProperty('--mx', ((mx - r.left) / r.width  * 100) + '%');
        grid.style.setProperty('--my', ((my - r.top)  / r.height * 100) + '%');
      }
    });

    grid.addEventListener('mouseenter', () => {
      isInside = true;
      grid.style.setProperty('--glow', '1');
      synthTick(1600, 0.03, 0.03);
    });

    grid.addEventListener('mouseleave', () => {
      isInside = false;
      grid.style.setProperty('--glow', '0');
    });

    grid.addEventListener('pointerdown', e => {
      synthClick();
      const cx = e.clientX, cy = e.clientY;
      filings.forEach((_, i) => {
        const c = centers[i];
        const dx = c.x - cx, dy = c.y - cy;
        const dist = Math.sqrt(dx * dx + dy * dy) + 1;
        setTimeout(() => {
          burstVel[i] += Math.max(0, 1 - dist / 260) * 22 * (Math.random() > 0.5 ? 1 : -1);
        }, (dist / 420) * 1000);
      });
    });

    grid.addEventListener('touchstart', e => {
      e.preventDefault();
      const t = e.touches[0];
      mx = t.clientX; my = t.clientY; isInside = true;
    }, { passive: false });

    grid.addEventListener('touchmove', e => {
      e.preventDefault();
      const t = e.touches[0];
      mx = t.clientX; my = t.clientY;
      maybeTick(mx, my);
    }, { passive: false });

    grid.addEventListener('touchend', () => { isInside = false; });

    function lerpAngle(a, b, t) {
      let d = b - a;
      while (d >  180) d -= 360;
      while (d < -180) d += 360;
      return a + d * t;
    }

    function tick() {
      for (let i = 0; i < filings.length; i++) {
        const c = centers[i];
        tgtAngles[i] = Math.atan2(my - c.y, mx - c.x) * 180 / Math.PI;

        if (Math.abs(burstVel[i]) > 0.05) {
          curAngles[i] += burstVel[i];
          burstVel[i] *= 0.87;
        } else {
          burstVel[i] = 0;
          curAngles[i] = lerpAngle(curAngles[i], tgtAngles[i], LERP);
        }

        filings[i].style.transform = `rotate(${curAngles[i]}deg)`;
      }
      requestAnimationFrame(tick);
    }

    tick();
  </script>
</body>
</html>
